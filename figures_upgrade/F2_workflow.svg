   <g id="text_1">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="155.535" y="50.859" transform="rotate(-0 155.535 50.859)">1. Source integration</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(96.048516 98.026312)">DTI + PAPI + NSO controls</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(97.566563 111.554437)">63 provinces; 2020--2024</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(69.916875 125.954437)">Keys, missingness, raw-source checks</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="462.435" y="50.859" transform="rotate(-0 462.435 50.859)">2. Measurement audit</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(364.139531 97.154437)">Full e-governance = Internet + service sum</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(371.265703 111.554437)">Service sum = portal access + response</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(365.187891 125.954437)">Five recurring percentages: diagnostic only</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="155.535" y="217.179" transform="rotate(-0 155.535 217.179)">3. Territorial sensitivity</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(87.457734 249.074437)">63 units mapped to 34 groups</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(55.965469 263.474438)">Variance + Theil; common observed sample</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(83.978672 277.874437)">5,000 unrestricted assignments</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(63.254766 292.687172)">4 connected chains: 50,000 burn-in each</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(53.517891 306.674438)">1,000 retained draws per chain; thinning 500</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="462.435" y="217.179" transform="rotate(-0 462.435 217.179)">4. Association and prediction</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(357.239766 256.274437)">Province/year effects; matched lags; wild tests</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(361.926094 270.674438)">Ridge: 5 repeats of 5 province-grouped folds</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(381.956719 285.074437)">4 inner folds; controls-only baseline</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(366.2475 299.887172)">Pre-reform associations, not reform effects</text>
   </g>
